name: Publish image

# Build the Docker image and push it to GitHub Container Registry (GHCR).
# Auth uses the built-in GITHUB_TOKEN — no secrets to configure.

on:
  # Every branch push builds a testable image (:<branch> + :sha-…); every v* tag
  # builds the versioned release (:1.2.3/:1.2/:1/:latest). Both filters are needed:
  # listing only tags would stop branch pushes from triggering at all.
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/marceltov/trilium-mcp

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Each tag type fires only on its matching event, so one list serves both:
          #   branch push -> :<branch>              (a testable image; latest is NOT moved)
          #   v* tag push -> :1.2.3/:1.2/:1 + :latest (default latest=auto)
          # No :sha tags: :<branch> covers testing, and GHCR keeps an immutable
          # @sha256 digest per image for exact pinning/rollback when needed.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag a commit (e.g. v0.1.0) to publish a GitHub release. Real release notes come from
  # the annotated tag message (write them with `git tag -a`); the install instructions are
  # appended below them so every release always carries them. Re-runs update the release
  # in place, so the tag can be created from the UI or the CLI first — this job reconciles.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Annotated tag message (empty for a lightweight tag), then the install section.
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > notes.md
          [ -s notes.md ] && printf '\n---\n\n' >> notes.md
          cat >> notes.md <<'EOF'
          ## Install

          All you need is a running Trilium and Docker — no checkout, no build.

          **1. Create an ETAPI token in Trilium** — *Options → ETAPI → Create new ETAPI token*. This token is the only credential: trilium-mcp stores no secret and forwards the raw token straight through to Trilium. Each client presents its own token per request.

          **2. Add trilium-mcp to your Trilium's `docker-compose.yaml`** — one service, pulling the prebuilt image, so there's nothing to clone or build:

          ```yaml
          services:
            trilium:
              # ... your existing Trilium service ...

            trilium-mcp:
              image: ghcr.io/marceltov/trilium-mcp:__VERSION__
              container_name: trilium-mcp
              restart: unless-stopped
              environment:
                # Service name of your existing Trilium on the same compose network.
                TRILIUM_SERVER_URL: http://trilium:8080
              ports:
                - "8081:8081"
          ```

          Then start it:

          ```bash
          docker compose up -d trilium-mcp
          ```

          Both services share the compose network, so `trilium` resolves to your existing container. The MCP endpoint is then reachable at `http://trilium-mcp-hostname-or-ip:8081/mcp` (or `https://trilium-mcp.example/mcp` behind a TLS reverse proxy).

          **3. Connect your MCP client** with the token from step 1, pointing at wherever trilium-mcp is reachable:

          ```bash
          # Directly over a trusted LAN, by hostname or IP
          claude mcp add trilium --scope user --transport http \
            http://trilium-mcp-hostname-or-ip:8081/mcp \
            --header "Authorization: YOUR_TRILIUM_ETAPI_TOKEN"

          # Behind a TLS reverse proxy
          claude mcp add trilium --scope user --transport http \
            https://trilium-mcp.example/mcp \
            --header "Authorization: YOUR_TRILIUM_ETAPI_TOKEN"
          ```

          Full guide: [README](https://github.com/Marceltov/trilium-mcp/blob/__TAG__/README.md#quick-start)
          EOF
          # The git tag keeps its `v` (v0.1.0); the image tag drops it (0.1.0).
          sed -i "s|__VERSION__|${TAG#v}|g; s|__TAG__|$TAG|g" notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
