site_name: trilium-mcp
site_description: An MCP server that turns the Trilium ETAPI into tools for Claude and other MCP clients.
site_url: https://trilium-mcp.marceltov.de/
repo_url: https://github.com/Marceltov/trilium-mcp
repo_name: Marceltov/trilium-mcp
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/trilium-mcp/blob/main/LICENSE">AGPL-3.0-or-later</a>

# Diagram sources are embedded into pages; planning notes are local-only.
exclude_docs: |
  diagrams/
  superpowers/

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started.md
  - Connect a client:
      - Overview: connecting.md
      - Claude Code: claude-code.md
      - Claude.ai: claude-ai.md
      - ChatGPT: chatgpt.md
      - Multiple instances: multiple-instances.md
  - Deployment:
      - Compose examples: compose-examples.md
      - Configuration: configuration.md
      - Reverse proxy and TLS: reverse-proxy.md
      - Security: security.md
  - Internals:
      - How it works: how-it-works.md
      - Design decisions:
          - OAuth login via the Trilium password: adr/0001-oauth-login-via-trilium-password.md
          - ChatGPT Custom GPT Action proxy: adr/0002-chatgpt-custom-gpt-action-proxy.md
          - Mermaid diagrams: adr/0003-mermaid-diagrams-in-the-docs-site.md
  - Project:
      - Alternatives: alternatives.md
      - Contributing: contributing.md

theme:
  name: material
  logo: trilium.svg
  favicon: trilium.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
