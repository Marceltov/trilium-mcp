# Trilium + trilium-mcp on a trusted local network, with ETAPI tokens.
# Copy .env.example to .env, adjust it, then: docker compose up -d
services:
  trilium:
    image: triliumnext/trilium:${TRILIUM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${TRILIUM_DATA_DIR:-./trilium-data}:/home/node/trilium-data

  trilium-mcp:
    image: ghcr.io/marceltov/trilium-mcp:latest
    restart: unless-stopped
    depends_on:
      - trilium
    environment:
      TRILIUM_SERVER_URL: http://trilium:8080
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    ports:
      - "8081:8081"
