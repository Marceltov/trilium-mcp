# Trilium + trilium-mcp behind Caddy with automatic HTTPS, OAuth enabled.
# Point both domains' DNS at this host, open ports 80 and 443,
# copy .env.example to .env, fill it in, then: docker compose up -d
services:
  trilium:
    image: triliumnext/trilium:${TRILIUM_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ${TRILIUM_DATA_DIR:-./trilium-data}:/home/node/trilium-data

  trilium-mcp:
    image: ghcr.io/marceltov/trilium-mcp:latest
    restart: unless-stopped
    depends_on:
      - trilium
    environment:
      TRILIUM_SERVER_URL: http://trilium:8080
      MCP_BASE_URL: https://${MCP_DOMAIN:?set MCP_DOMAIN in .env}
      MCP_OAUTH_SECRET: ${MCP_OAUTH_SECRET:?set MCP_OAUTH_SECRET in .env}
      MCP_ALLOWED_HOSTS: ${MCP_DOMAIN}
      CHATGPT_ACTIONS: ${CHATGPT_ACTIONS:-}
    volumes:
      # Encrypted OAuth logins; keeps clients signed in across updates.
      - mcp-oauth:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRILIUM_DOMAIN: ${TRILIUM_DOMAIN:?set TRILIUM_DOMAIN in .env}
      MCP_DOMAIN: ${MCP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  mcp-oauth:
  caddy-data:
