# trilium-mcp next to an existing Trilium, as its own compose project.
# Copy .env.example to .env, adjust it, then: docker compose up -d
services:
  trilium-mcp:
    image: ghcr.io/marceltov/trilium-mcp:latest
    container_name: trilium-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      # OAuth logins survive container updates (unused with tokens only).
      - mcp-oauth:/data
    ports:
      - "8081:8081"
    networks:
      - trilium

networks:
  # The Docker network your Trilium container is already on.
  trilium:
    external: true
    name: ${TRILIUM_NETWORK:?set TRILIUM_NETWORK in .env}

volumes:
  mcp-oauth:
