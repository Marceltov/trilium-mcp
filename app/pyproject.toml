[project]
name = "trilium_etapi_mcp"
version = "0.4.0"
description = "Standalone MCP server exposing the Trilium ETAPI over HTTP"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=4.1.3",
    "mcp-login-oauth @ git+https://github.com/Marceltov/mcp-login-oauth@v0.2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[tool.uv]
# Single-module app; install only the dependencies (no build backend needed).
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
